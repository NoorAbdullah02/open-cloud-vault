services:
  - type: web
    name: noorvault-api
    runtime: node
    plan: free
    buildCommand: npm install && npm run build --workspace=@noor-drive/api
    startCommand: npm run start --workspace=@noor-drive/api
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGIN
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 30d
      - key: SUPER_ADMIN_EMAIL
        value: admin@noordrive.local
      - key: SUPER_ADMIN_PASSWORD
        sync: false
      - key: DRIVE_PASSCODE
        sync: false
      - key: DEFAULT_STORAGE_PROVIDER
        value: TELEGRAM_MTPROTO
      - key: TELEGRAM_ENABLED
        value: "true"
      - key: TELEGRAM_USER_CONSENT
        value: "true"
      - key: TELEGRAM_API_ID
        sync: false
      - key: TELEGRAM_API_HASH
        sync: false
      - key: TELEGRAM_SESSION_STRING
        sync: false
      - key: TELEGRAM_TARGET_CHANNEL
        value: me

  - type: web
    name: noorvault
    runtime: node
    plan: free
    buildCommand: npm install && npm run build --workspace=@noor-drive/web
    startCommand: npm run start --workspace=@noor-drive/web
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_URL
        sync: false
      - key: NEXT_PUBLIC_WS_URL
        sync: false

