services:
  - type: web
    name: noor-cloud-vault
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DRIVE_PASSCODE
        sync: false
      - key: SUPER_ADMIN_EMAIL
        value: admin@noordrive.local
      - key: SUPER_ADMIN_PASSWORD
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 30d
      - key: DEFAULT_STORAGE_PROVIDER
        value: TELEGRAM_MTPROTO
      - key: TELEGRAM_ENABLED
        value: "true"
      - key: TELEGRAM_USER_CONSENT
        value: "true"
      - key: TELEGRAM_API_ID
        sync: false
      - key: TELEGRAM_API_HASH
        sync: false
      - key: TELEGRAM_SESSION_STRING
        sync: false
      - key: TELEGRAM_TARGET_CHANNEL
        value: me
      - key: CORS_ORIGIN
        value: https://noor-cloud-vault.onrender.com
