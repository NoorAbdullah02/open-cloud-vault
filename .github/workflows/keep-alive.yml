name: Keep Alive Render Instance

on:
  schedule:
    - cron: '*/10 * * * *' # Every 10 minutes to prevent Render free instance 15-min spin-down
  workflow_dispatch:

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Noor Cloud Vault API
        run: |
          echo "Pinging Noor Drive live instance to keep it warm and prevent 50s cold start..."
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" -m 45 https://noor-cloud-vault.onrender.com/api/shares/app-release || echo "FAILED")
          echo "Render response status: $STATUS"
