name: Build Multi-Platform Desktop & Mobile Apps

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Target Release Tag Name (e.g. v1.0.61)'
        required: false
        default: 'v1.0.61'
  release:
    types: [published]
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-linux:
    name: Build Linux (.deb & .tar.gz)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Linux Build Dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libsecret-1-dev

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Build Flutter Linux Release
        working-directory: apps/mobile
        run: |
          flutter pub get
          flutter build linux --release

      - name: Package Linux .deb and .tar.gz
        run: |
          TARGET_TAG="${{ github.event.inputs.tag_name || github.event.release.tag_name || github.ref_name }}"
          [ -z "$TARGET_TAG" ] && TARGET_TAG="v1.0.60"
          VERSION="${TARGET_TAG#v}"
          if ! [[ "$VERSION" =~ ^[0-9] ]]; then
            VERSION="1.0.60"
          fi

          RELEASE_DIR="apps/mobile/build/linux/x64/release/bundle"
          DEB_DIR="deb_package/noor-drive_${VERSION}_amd64"
          mkdir -p "${DEB_DIR}/usr/bin"
          mkdir -p "${DEB_DIR}/usr/lib/noor-drive"
          mkdir -p "${DEB_DIR}/usr/share/applications"
          mkdir -p "${DEB_DIR}/usr/share/pixmaps"
          for size in 48x48 64x64 128x128 256x256 512x512 1024x1024; do
            mkdir -p "${DEB_DIR}/usr/share/icons/hicolor/$size/apps"
            cp apps/mobile/assets/app_icon.png "${DEB_DIR}/usr/share/icons/hicolor/$size/apps/noor-drive.png"
            cp apps/mobile/assets/app_icon.png "${DEB_DIR}/usr/share/icons/hicolor/$size/apps/com.noordrive.app.noor_drive_app.png"
          done
          mkdir -p "${DEB_DIR}/DEBIAN"

          cp -r ${RELEASE_DIR}/* "${DEB_DIR}/usr/lib/noor-drive/"
          cp apps/mobile/assets/app_icon.png "${DEB_DIR}/usr/share/pixmaps/noor-drive.png"
          cp apps/mobile/assets/app_icon.png "${DEB_DIR}/usr/share/pixmaps/com.noordrive.app.noor_drive_app.png"

          cat << 'EOF' > "${DEB_DIR}/usr/bin/noordrive"
          #!/bin/sh
          cd /usr/lib/noor-drive
          exec /usr/lib/noor-drive/noor_drive_app "$@"
          EOF
          chmod 755 "${DEB_DIR}/usr/bin/noordrive"

          cat << EOF > "${DEB_DIR}/DEBIAN/control"
          Package: noor-drive
          Version: ${VERSION}
          Section: utils
          Priority: optional
          Architecture: amd64
          Maintainer: Noor Abdullah <noorabdullah@example.com>
          Description: NOOR DRIVE Desktop Cloud Vault
           Multi-platform personal cloud vault with ~/NoorDrive local folder auto-sync.
          EOF

          cat << EOF > "${DEB_DIR}/usr/share/applications/noor-drive.desktop"
          [Desktop Entry]
          Name=NOOR DRIVE
          Comment=Personal Cloud Vault & Auto-Sync
          Exec=/usr/bin/noordrive %U
          Icon=noor-drive
          Terminal=false
          Type=Application
          Categories=Utility;Network;
          StartupWMClass=com.noordrive.app.noor_drive_app
          StartupNotify=true
          EOF

          cp "${DEB_DIR}/usr/share/applications/noor-drive.desktop" "${DEB_DIR}/usr/share/applications/com.noordrive.app.noor_drive_app.desktop"

          dpkg-deb --build "deb_package/noor-drive_${VERSION}_amd64" "$GITHUB_WORKSPACE/noor-drive-linux.deb"
          tar -czvf "$GITHUB_WORKSPACE/noor-drive-linux.tar.gz" -C "${RELEASE_DIR}" .

      - name: Determine Target Release Tag
        id: get_tag
        shell: bash
        run: |
          TAG="${{ github.event.inputs.tag_name || github.event.release.tag_name || github.ref_name }}"
          if [ -z "$TAG" ] || [ "$TAG" = "master" ]; then
            TAG=$(gh release view --json tagName -q .tagName 2>/dev/null || echo "v1.0.61")
          fi
          [ -z "$TAG" ] && TAG="v1.0.61"
          echo "tag=$TAG" >> $GITHUB_OUTPUT
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Linux Assets to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_tag.outputs.tag }}
          files: |
            noor-drive-linux.deb
            noor-drive-linux.tar.gz

  build-windows:
    name: Build Windows (.exe / .zip)
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y

      - name: Build Windows Release
        working-directory: apps/mobile
        shell: pwsh
        run: |
          $env:CL = "/D_SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS"
          flutter pub get
          flutter build windows --release

      - name: Package Windows Bundle & Installer
        shell: pwsh
        run: |
          $ReleaseDir = "apps/mobile/build/windows/x64/runner/Release"
          Compress-Archive -Path "$ReleaseDir\*" -DestinationPath "$env:GITHUB_WORKSPACE\NoorDrive-Windows-Portable.zip" -Force
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" scripts/desktop/windows-installer.iss

      - name: Determine Target Release Tag
        id: get_tag
        shell: bash
        run: |
          TAG="${{ github.event.inputs.tag_name || github.event.release.tag_name || github.ref_name }}"
          if [ -z "$TAG" ] || [ "$TAG" = "master" ]; then
            TAG=$(gh release view --json tagName -q .tagName 2>/dev/null || echo "v1.0.61")
          fi
          [ -z "$TAG" ] && TAG="v1.0.61"
          echo "tag=$TAG" >> $GITHUB_OUTPUT
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Windows Assets to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_tag.outputs.tag }}
          files: |
            NoorDrive-Setup.exe
            NoorDrive-Windows-Portable.zip

  build-macos:
    name: Build macOS (.dmg / .zip)
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Build macOS Release
        working-directory: apps/mobile
        run: |
          flutter pub get
          flutter build macos --release

      - name: Package Native macOS .dmg & .zip
        run: |
          cd apps/mobile/build/macos/Build/Products/Release
          APP_NAME=$(ls -d *.app | head -n 1)
          echo "Packaging macOS Application: $APP_NAME"
          hdiutil create -volname "NOOR DRIVE" -srcfolder "$APP_NAME" -ov -format UDZO "$GITHUB_WORKSPACE/NoorDrive.dmg"
          zip -r -y "$GITHUB_WORKSPACE/NoorDrive-macOS.zip" "$APP_NAME"

      - name: Determine Target Release Tag
        id: get_tag
        shell: bash
        run: |
          TAG="${{ github.event.inputs.tag_name || github.event.release.tag_name || github.ref_name }}"
          if [ -z "$TAG" ] || [ "$TAG" = "master" ]; then
            TAG=$(gh release view --json tagName -q .tagName 2>/dev/null || echo "v1.0.61")
          fi
          [ -z "$TAG" ] && TAG="v1.0.61"
          echo "tag=$TAG" >> $GITHUB_OUTPUT
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload macOS Assets to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_tag.outputs.tag }}
          files: |
            NoorDrive.dmg
            NoorDrive-macOS.zip
