name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'apps/mobile/**'
      - '.github/workflows/build-ios-ipa.yml'

permissions:
  contents: write

jobs:
  build-ipa:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Initialize iOS project & configurations
        working-directory: apps/mobile
        run: |
          flutter create . --platforms=ios,android --project-name noor_drive_app --org com.noordrive.app
          PLIST="ios/Runner/Info.plist"
          /usr/libexec/PlistBuddy -c "Add :NSFaceIDUsageDescription string 'NOOR DRIVE uses Face ID to authenticate and unlock your Secret Vault.'" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :NSPhotoLibraryUsageDescription string 'NOOR DRIVE requires photo library access to upload pictures and videos to your cloud drive.'" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :NSCameraUsageDescription string 'NOOR DRIVE requires camera access to capture documents and photos for cloud backup.'" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName string 'NOOR DRIVE'" "$PLIST" 2>/dev/null || true

      - name: Install dependencies & generate launcher icons
        working-directory: apps/mobile
        run: |
          flutter pub get
          dart run flutter_launcher_icons

      - name: Build iOS Application (Unsigned IPA)
        working-directory: apps/mobile
        run: |
          TARGET_TAG="${{ github.event.inputs.tag_name || (startsWith(github.ref, 'refs/tags/v') && github.ref_name) || format('v1.0.{0}', github.run_number) }}"
          BUILD_NUM=$(echo "$TARGET_TAG" | sed -n 's/.*v1\.0\.\([0-9]*\).*/\1/p')
          [ -z "$BUILD_NUM" ] && BUILD_NUM="${{ github.run_number }}"
          VERSION="${TARGET_TAG#v}"
          if ! [[ "$VERSION" =~ ^[0-9] ]]; then
            VERSION="1.0.${{ github.run_number }}"
          fi
          flutter build ios --release --no-codesign --build-name=$VERSION --build-number=$BUILD_NUM --dart-define=API_URL=https://drive.noor.is-a.dev/api --dart-define=APP_BUILD_NUMBER=$BUILD_NUM
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r noor-drive.ipa Payload
          ls -lh noor-drive.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: noor-drive-ios-ipa
          path: apps/mobile/noor-drive.ipa

      - name: Publish iOS GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ios-v1.0.${{ github.run_number }}
          name: NOOR DRIVE iOS v1.0.${{ github.run_number }}
          files: apps/mobile/noor-drive.ipa
          make_latest: false
