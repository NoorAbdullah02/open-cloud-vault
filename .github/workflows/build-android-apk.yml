name: Build Android APK

on:
  push:
    branches: [master]
    paths:
      - 'apps/mobile/**'
      - '.github/workflows/build-android-apk.yml'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Target Release Tag Name (e.g. v1.0.73)'
        required: false
        default: 'v1.0.73'

permissions:
  contents: write
  actions: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.1'
          channel: 'stable'
          cache: true

      - name: Initialize Android project & permissions
        working-directory: apps/mobile
        run: |
          flutter create . --platforms=android --project-name noor_drive_app --org com.noordrive.app
          python3 android_custom/patch_android.py
          if [ -f "android/gradle/wrapper/gradle-wrapper.properties" ]; then
            sed -i 's|https\\://github.com/gradle/gradle-distributions/releases/download/v8.3.0/gradle-8.3-all.zip|https\\://services.gradle.org/distributions/gradle-8.3-all.zip|g' android/gradle/wrapper/gradle-wrapper.properties
            sed -i 's|github.com/gradle/gradle-distributions/releases/download|services.gradle.org/distributions|g' android/gradle/wrapper/gradle-wrapper.properties
          fi

      - name: Install dependencies, generate launcher icon & build APK
        working-directory: apps/mobile
        run: |
          TARGET_TAG="${{ github.event.inputs.tag_name }}"
          if [ -z "$TARGET_TAG" ] && [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TARGET_TAG="${{ github.ref_name }}"
          fi
          [ -z "$TARGET_TAG" ] && TARGET_TAG="v1.0.73"
          BUILD_NUM=$(echo "$TARGET_TAG" | sed -n 's/.*v1\.0\.\([0-9]*\).*/\1/p')
          [ -z "$BUILD_NUM" ] && BUILD_NUM="73"
          VERSION="${TARGET_TAG#v}"
          if ! [[ "$VERSION" =~ ^[0-9] ]]; then
            VERSION="1.0.73"
          fi
          flutter pub get
          dart run flutter_launcher_icons
          flutter build apk --release --build-name=$VERSION --build-number=$BUILD_NUM --dart-define=API_URL=https://drive.noor.is-a.dev/api --dart-define=APP_BUILD_NUMBER=$BUILD_NUM
          cp build/app/outputs/flutter-apk/app-release.apk noor-drive.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: noor-drive-apk
          path: apps/mobile/noor-drive.apk

      - name: Determine Target Release Tag
        id: release_tag
        run: |
          TAG="${{ github.event.inputs.tag_name }}"
          if [ -z "$TAG" ] && [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG="${{ github.ref_name }}"
          fi
          if [ -z "$TAG" ] || [ "$TAG" = "false" ]; then
            TAG=$(gh release view --json tagName -q .tagName 2>/dev/null || echo "")
          fi
          if [ -z "$TAG" ] || [ "$TAG" = "false" ]; then
            TAG="v1.0.73"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_tag.outputs.tag }}
          name: NOOR DRIVE Android ${{ steps.release_tag.outputs.tag }}
          files: apps/mobile/noor-drive.apk
          make_latest: true

      - name: Trigger Desktop Builds for this Release
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
        continue-on-error: true
        run: |
          TAG="${{ steps.release_tag.outputs.tag }}"
          gh workflow run "Build Multi-Platform Desktop & Mobile Apps" -f tag_name="$TAG" || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

