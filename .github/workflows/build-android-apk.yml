name: Build Android APK

on:
  push:
    branches: [master]
    paths:
      - 'apps/mobile/**'
      - '.github/workflows/build-android-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.1'
          channel: 'stable'
          cache: true

      - name: Initialize Android project & permissions
        working-directory: apps/mobile
        run: |
          flutter create . --platforms=android --project-name noor_drive_app --org com.noordrive.app
          sed -i 's/<application/<uses-permission android:name="android.permission.INTERNET" \/>\n    <uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES" \/>\n    <uses-permission android:name="android.permission.USE_BIOMETRIC" \/>\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" \/>\n    <uses-permission android:name="android.permission.READ_MEDIA_IMAGES" \/>\n    <uses-permission android:name="android.permission.READ_MEDIA_VIDEO" \/>\n    <uses-permission android:name="android.permission.READ_MEDIA_AUDIO" \/>\n    <application/' android/app/src/main/AndroidManifest.xml
          sed -i 's/android:label="noor_drive_app"/android:label="NOOR DRIVE"/' android/app/src/main/AndroidManifest.xml
          find android/app/src -name "MainActivity.kt" -exec sed -i 's/import io.flutter.embedding.android.FlutterActivity/import io.flutter.embedding.android.FlutterFragmentActivity/' {} +
          find android/app/src -name "MainActivity.kt" -exec sed -i 's/: FlutterActivity()/: FlutterFragmentActivity()/' {} +
          if [ -f "android/gradle/wrapper/gradle-wrapper.properties" ]; then
            sed -i 's|https\\://github.com/gradle/gradle-distributions/releases/download/v8.3.0/gradle-8.3-all.zip|https\\://services.gradle.org/distributions/gradle-8.3-all.zip|g' android/gradle/wrapper/gradle-wrapper.properties
            sed -i 's|github.com/gradle/gradle-distributions/releases/download|services.gradle.org/distributions|g' android/gradle/wrapper/gradle-wrapper.properties
          fi

      - name: Install dependencies, generate launcher icon & build APK
        working-directory: apps/mobile
        run: |
          flutter pub get
          dart run flutter_launcher_icons
          flutter build apk --release --dart-define=API_URL=https://noor-cloud-vault.onrender.com/api --dart-define=APP_BUILD_NUMBER=${{ github.run_number }}
          cp build/app/outputs/flutter-apk/app-release.apk noor-drive.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: noor-drive-apk
          path: apps/mobile/noor-drive.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: NOOR DRIVE Android v1.0.${{ github.run_number }}
          files: apps/mobile/noor-drive.apk
          make_latest: true

